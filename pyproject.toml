[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecs-rebuild"
version = "0.1.0"
description = "Enterprise e-commerce CS rebuilt with LangGraph (Scheme A)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "langgraph>=0.2.50",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "sqlalchemy>=2.0.36",
  "pymysql>=1.1.1",
  "cryptography>=43.0.0",
  "neo4j>=5.26.0",
  "neo4j-graphrag>=1.4.0",
  "jieba>=0.42.1",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
